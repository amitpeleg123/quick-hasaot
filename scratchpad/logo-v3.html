<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<title>לוגו v3</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:Arial;}
  .card{
    display:inline-flex;align-items:center;gap:16px;
    padding:36px 44px;
  }
  .navy-bg{background:#0b2545;}
  .white-bg{background:#ffffff;}
  .plane{font-size:38px;line-height:1;transform:scaleX(-1) rotate(-25deg);display:inline-block;}
  .plane.navy{filter:none;}
  .text-block{display:flex;flex-direction:column;gap:6px;}
  .wordmark{
    font-family:'Assistant',Arial,sans-serif;
    font-weight:800;
    font-size:52px;
    line-height:1;
    letter-spacing:-1px;
  }
  .navy-bg .wordmark{color:#ffffff;}
  .white-bg .wordmark{color:#0b2545;}
  .rule{width:100%;height:3px;background:#c9a44c;margin:4px 0;}
  .subtitle{
    font-family:'Assistant',Arial,sans-serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:0.5px;
    color:#c9a44c;
  }
</style>
</head>
<body>

<div class="card navy-bg">
  <span class="plane">✈</span>
  <div class="text-block">
    <span class="wordmark">Quick</span>
    <div class="rule"></div>
    <span class="subtitle">הסעות שדה התעופה</span>
  </div>
</div>

<br>

<div class="card white-bg">
  <span class="plane">✈</span>
  <div class="text-block">
    <span class="wordmark">Quick</span>
    <div class="rule"></div>
    <span class="subtitle">הסעות שדה התעופה</span>
  </div>
</div>

</body>
</html>
