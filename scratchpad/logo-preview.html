<!doctype html>
<html lang="he" dir="rtl">
<head>

<title>לוגו Quick - תצוגה מקדימה</title>
<style>
  body{background:#0b2545;padding:60px;font-family:Arial;display:flex;flex-direction:column;gap:40px;align-items:center;}

<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">

<h3>גרסה חדשה - מודרנית (רקע כהה)</h3>
<div class="bg-navy" style="overflow:visible;">
<svg width="440" height="120" viewBox="0 0 440 120" xmlns="http://www.w3.org/2000/svg">
  <!-- Simple minimal plane icon, top-right of the wordmark -->
  <g transform="translate(345,18) rotate(35)">
    <path d="M0 14 L4 0 L8 14 L4 11 Z" fill="#c9a44c"/>
    <path d="M-6 9 L4 6 L14 9 L4 7.5 Z" fill="#c9a44c"/>
  </g>

  <!-- QUICK wordmark, modern sans-serif -->
  <text x="0" y="55" font-family="Assistant, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">Quick</text>

  <!-- Thin gold rule -->

  <!-- Subtitle -->
  <text x="2" y="92" font-family="Assistant, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="0.5" fill="#c9a44c">הסעות שדה התעופה</text>
</svg>
</div>
